# 门诊医嘱-病程矛盾检测规则定义
# 用于检测HIS医嘱与EMR病程记录之间的存在性矛盾

# 规则版本
version: "1.0"

# 矛盾类型说明：
# 1. ordered_but_not_recorded（开了没写）：医生开了医嘱但在病程记录中未找到对应记录
# 2. recorded_but_not_ordered（写了没开）：病程记录中提及了某个项目但医嘱中没有对应记录

# 矛盾检测规则
rules:
  # 规则1：开了没写
  # 描述：HIS系统中有医嘱记录，但EMR病程记录中没有该医嘱项目的记录
  # 场景：医生开具了检查/检验/药品/治疗医嘱，但未在病程记录中书写
  ordered_but_not_recorded:
    rule_id: "RULE_001"
    rule_type: "ordered_but_not_recorded"
    display_name: "开了没写"
    description: |
      检测医生开具了医嘱但在病程记录中未书写对应记录的情况。
      这类矛盾常见于：门诊医生开了检查单但忘了在病程记录里描述、
      开了药品医嘱但病程记录中未提及用药情况等。
    severity: "high"  # 高危：属于核心医疗文书缺失

    # 必需字段：HIS医嘱记录中必须包含这些字段
    required_his_fields:
      - "order_id"
      - "patient_id"
      - "doctor_id"
      - "department"
      - "order_type"
      - "item_name"
      - "create_time"

    # 必需字段：EMR病程记录中必须包含这些字段
    required_emr_fields:
      - "record_id"
      - "patient_id"
      - "doctor_id"
      - "department"
      - "record_type"
      - "content_keywords"
      - "create_time"

    # 关键词匹配规则
    # 用于在EMR病程记录的content_keywords中匹配HIS医嘱的item_name
    keyword_matching:
      # 是否启用模糊匹配（包含关系）
      fuzzy_match: true

      # 同义词映射：将HIS医嘱item_name映射到病程记录中可能使用的同义词
      synonyms:
        # 检查项目同义词
        "B超": ["B超", "B型超声", "彩超", "超声检查", "腹部B超", "泌尿系B超"]
        "CT": ["CT", "计算机断层扫描", "CT检查", "胸部CT", "头颅CT"]
        "核磁共振": ["MRI", "核磁", "磁共振", "MR", "磁共振检查"]
        "X光": ["X光", "X线", "胸片", "胸部X线", "X-ray"]
        "心电图": ["心电图", "ECG", "心电检查", "常规心电图"]
        "血常规": ["血常规", "血细胞分析", "血液分析", "CBC"]
        "尿常规": ["尿常规", "尿分析", "尿液分析", "UA"]
        "大便常规": ["大便常规", "粪便常规", "粪便分析"]
        "肝功能": ["肝功能", "肝功", "肝脏功能", "生化-肝"]
        "肾功能": ["肾功能", "肾功", "肾脏功能", "生化-肾"]
        "血糖": ["血糖", "Glu", "空腹血糖", "餐后血糖"]
        "血脂": ["血脂", "血脂分析", "生化-血脂"]
        "凝血功能": ["凝血功能", "凝血四项", "凝血象"]
        "血沉": ["血沉", "ESR", "红细胞沉降率"]
        "C反应蛋白": ["CRP", "C反应蛋白", "超敏C反应蛋白", "hs-CRP"]

        # 药品同义词
        "阿莫西林": ["阿莫西林", "阿莫西林胶囊", "阿莫西林片", "Amoxicillin"]
        "布洛芬": ["布洛芬", "布洛芬片", "布洛芬混悬液", "Ibuprofen"]
        "对乙酰氨基酚": ["对乙酰氨基酚", "扑热息痛", "泰诺", "Paracetamol"]
        "头孢克肟": ["头孢克肟", "头孢克肟分散片", "头孢克肟胶囊", "Cefixime"]
        "左氧氟沙星": ["左氧氟沙星", "左氧氟沙星片", "可乐必妥", "Levofloxacin"]
        "阿奇霉素": ["阿奇霉素", "阿奇霉素片", "希舒美", "Azithromycin"]
        "奥美拉唑": ["奥美拉唑", "奥美拉唑肠溶胶囊", "洛赛克", "Omeprazole"]
        "蒙脱石散": ["蒙脱石散", "思密达", "肯特令"]
        "维生素C": ["维生素C", "Vc", "抗坏血酸"]
        "维生素B": ["维生素B", "B族维生素", "复合维生素B"]
        "钙片": ["钙片", "碳酸钙", "迪巧", "钙尔奇D"]
        "铁剂": ["铁剂", "硫酸亚铁", "多糖铁", "琥珀酸亚铁"]
        "甲硝唑": ["甲硝唑", "灭滴灵", "Metronidazole"]
        "替硝唑": ["替硝唑", "Tinidazole"]
        "氯雷他定": ["氯雷他定", "开瑞坦", "Loratadine"]
        "西替利嗪": ["西替利嗪", "仙特明", "Cetirizine"]

        # 治疗项目同义词
        "雾化": ["雾化", "雾化吸入", "氧气雾化", "雾化治疗"]
        "吸氧": ["吸氧", "氧气吸入", "鼻导管吸氧", "面罩吸氧"]
        "输液": ["输液", "静脉输液", "静脉滴注", "挂水"]
        "注射": ["注射", "肌肉注射", "肌注", "皮下注射"]
        "换药": ["换药", "伤口换药", "外科换药"]
        "拆线": ["拆线", "伤口拆线"]
        "导尿": ["导尿", "留置导尿", "导尿术"]
        "胃管": ["胃管", "留置胃管", "鼻胃管", "胃肠减压"]
        "灌肠": ["灌肠", "保留灌肠", "大量不保留灌肠"]
        "洗胃": ["洗胃", "急诊洗胃"]
        "穿刺": ["穿刺", "胸腔穿刺", "腹腔穿刺", "腰椎穿刺"]
        "牵引": ["牵引", "骨牵引", "颈椎牵引", "腰椎牵引"]

      # 排除词：病程记录中出现这些词时不触发矛盾
      # 例如：患者拒绝检查、预约检查还未做、药品暂未领取等
      exclusion_keywords:
        - "拒绝"
        - "患者拒绝"
        - "暂未"
        - "未执行"
        - "预约"
        - "待执行"
        - "等候"
        - "已预约"
        - "拒绝检查"
        - "拒绝治疗"
        - "暂不"
        - "暂不执行"

    # 时间窗口配置
    # 在医嘱创建时间之后的time_window_minutes内查找对应病程记录
    time_window:
      minutes: 120  # 默认120分钟（2小时）内必须书写病程记录
      description: "医嘱创建后必须在规定时间内完成病程记录"

    # 适用科室（可为空表示所有科室）
    applicable_departments: []

    # 适用医嘱类型
    applicable_order_types:
      - "检查"
      - "检验"
      - "药品"
      - "治疗"
      - "手术"
      - "操作"

  # 规则2：写了没开
  # 描述：EMR病程记录中提及了某个项目但HIS系统中没有对应医嘱
  # 场景：病程记录中写了检查/检验/药品/治疗，但实际未开医嘱（可能漏开或记录错误）
  recorded_but_not_ordered:
    rule_id: "RULE_002"
    rule_type: "recorded_but_not_ordered"
    display_name: "写了没开"
    description: |
      检测病程记录中提及了某个检查/检验/药品/治疗项目，
      但HIS系统中没有对应医嘱记录的情况。
      这类矛盾常见于：病程记录描述了某项检查结果但实际未开检查单、
      记录了用药情况但实际未开药品医嘱等。
    severity: "medium"  # 中危：可能是记录错误或补录遗漏

    # 必需字段：HIS医嘱记录中必须包含这些字段
    required_his_fields:
      - "order_id"
      - "patient_id"
      - "doctor_id"
      - "department"
      - "order_type"
      - "item_name"
      - "create_time"

    # 必需字段：EMR病程记录中必须包含这些字段
    required_emr_fields:
      - "record_id"
      - "patient_id"
      - "doctor_id"
      - "department"
      - "record_type"
      - "content_keywords"
      - "create_time"

    # 关键词匹配规则
    keyword_matching:
      # 是否启用模糊匹配
      fuzzy_match: true

      # 同义词映射（与规则1相同）
      synonyms:
        "B超": ["B超", "B型超声", "彩超", "超声检查"]
        "CT": ["CT", "计算机断层扫描", "CT检查"]
        "核磁共振": ["MRI", "核磁", "磁共振", "MR"]
        "X光": ["X光", "X线", "胸片", "X-ray"]
        "心电图": ["心电图", "ECG", "心电检查"]
        "血常规": ["血常规", "血细胞分析", "血液分析"]
        "尿常规": ["尿常规", "尿分析", "尿液分析"]
        "肝功能": ["肝功能", "肝功", "肝脏功能"]
        "肾功能": ["肾功能", "肾功", "肾脏功能"]
        "血糖": ["血糖", "Glu", "空腹血糖"]
        "阿莫西林": ["阿莫西林", "阿莫西林胶囊"]
        "布洛芬": ["布洛芬", "布洛芬片", "布洛芬混悬液"]
        "雾化": ["雾化", "雾化吸入", "氧气雾化"]
        "吸氧": ["吸氧", "氧气吸入"]
        "输液": ["输液", "静脉输液", "静脉滴注"]

      # 排除词
      exclusion_keywords:
        - "建议"
        - "计划"
        - "待开"
        - "待完善"
        - "必要时"
        - "必要时可"
        - "根据情况"
        - "必要时再"
        - "家属要求"
        - "患者要求"

    # 时间窗口配置
    # 在病程记录时间之前的time_window_minutes内查找对应医嘱
    time_window:
      minutes: 120  # 病程记录前120分钟内的医嘱视为同时发生
      description: "病程记录中提及的项目应在记录时间之前或同时开具医嘱"

    # 适用科室（可为空表示所有科室）
    applicable_departments: []

    # 适用记录类型
    applicable_record_types:
      - "首次病程"
      - "日常病程"
      - "上级医师查房"
      - "主治医师查房"
      - "主任医师查房"
      - "手术记录"
      - "抢救记录"
      - "出院记录"

# 告警阈值配置
alert_thresholds:
  # 按医生维度：单个医生当日矛盾数超过此值触发告警
  doctor_daily_threshold: 3

  # 按科室维度：单个科室当日矛盾数超过此值触发告警
  department_daily_threshold: 10

  # 严重程度阈值：当日高危矛盾数超过此值触发紧急告警
  high_severity_threshold: 1

  # 告警级别
  alert_levels:
    - name: "info"
      threshold: 0
      description: "仅记录，不发送告警"
    - name: "warning"
      threshold: 1
      description: "低频告警，提醒关注"
    - name: "error"
      threshold: 3
      description: "中频告警，需要处理"
    - name: "critical"
      threshold: 5
      description: "高频告警，立即处理"

# 严重程度分级配置
severity_thresholds:
  high:
    description: "核心医疗文书缺失，可能引发医疗质量安全事件"
    examples:
      - "检查医嘱未记录检查结果"
      - "药品医嘱未记录用药情况"
      - "手术医嘱未记录手术情况"
    action: "立即整改，补录病程记录"

  medium:
    description: "医疗文书记录不完整，需要补充说明"
    examples:
      - "治疗操作已完成但记录不详细"
      - "检验结果已回报但未记录分析"
    action: "尽快补充完善病程记录"

  low:
    description: "轻微记录瑕疵，不影响医疗质量安全"
    examples:
      - "记录时间略有偏差"
      - "用词不够规范"
    action: "日常注意改进"